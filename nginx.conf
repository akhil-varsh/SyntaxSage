events {
    worker_connections 1024;
}

http {
    upstream syntaxsage_app {
        server syntaxsage:8501;
    }
    
    upstream gemma3_api {
        server gemma3:8080;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=app:10m rate=30r/m;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Streamlit application
        location / {
            limit_req zone=app burst=5 nodelay;
            
            proxy_pass http://syntaxsage_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Streamlit specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # Gemma3 API endpoint (protected)
        location /api/ {
            limit_req zone=api burst=3 nodelay;
            
            # Internal access only
            allow 172.16.0.0/12;
            deny all;
            
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://gemma3_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoints
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}